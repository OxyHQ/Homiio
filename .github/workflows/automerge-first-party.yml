name: Auto-merge first-party bumps

# The Oxy SDKs (Bloom, services, core, contracts, Alia) should always be on their
# latest release. Dependabot opens the `oxy-platform` group PR weekly; this turns on
# auto-merge for it, and GitHub merges once the required check
# (`CI complete`) is green. A red check
# leaves the PR open for a person. Third-party updates are never touched here.

on:
  pull_request:
    branches: [main]

permissions: {}
# OxyHQ/oxy .github/workflows/automerge-first-party.yml.

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/bun/oxy-platform-')
    permissions:
      contents: write
      pull-requests: write
    uses: OxyHQ/oxy/.github/workflows/automerge-first-party.yml@main
