# Scheduled base-image digest bump: OxyHQ/oxy's shared
# .github/workflows/bump-base-image-digests.yml resolves each digest-pinned base
# of the reviewed images, rewrites the digests that moved, re-pins
# (reviewed-images.json) and opens or updates ONE owner-review pull request; it
# never merges, and dispatches ci.yml on the branch because a GITHUB_TOKEN PR
# triggers no pull_request workflows.
name: Bump base image digests

on:
  schedule:
    # Wednesday, not Monday: this workflow was copied to eight repositories
    # with the same Monday 05:23 slot, and each run dispatches CI on its PR
    # against the org's 20 concurrent job slots. Each copy has its own slot.
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump-base-digests
  cancel-in-progress: false

jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: OxyHQ/oxy/.github/workflows/bump-base-image-digests.yml@main
