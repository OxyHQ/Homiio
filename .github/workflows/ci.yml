name: Reanimated production web paired diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 37199af9f392abecba49f74f7cc1fbfbe1cf0d6d
          path: base
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged dependency and budget inputs
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 37199af9f392abecba49f74f7cc1fbfbe1cf0d6d
          git -C candidate fetch --no-tags --depth=1 origin 37199af9f392abecba49f74f7cc1fbfbe1cf0d6d
          git -C candidate diff --exit-code 37199af9f392abecba49f74f7cc1fbfbe1cf0d6d -- bun.lock performance-budgets.json packages/frontend/package.json package.json
      - name: Install both frozen trees
        run: |
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Check resolver, real Metro delegation, and caller guard
        run: |
          cd candidate/packages/frontend
          node scripts/test-reanimated-production-web-resolver.cjs
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),assert=require('assert');
          const root=path.dirname(require.resolve('react-native-reanimated/package.json'));
          const source=fs.readFileSync(path.join(root,'lib/module/ReanimatedModule/js-reanimated/JSReanimated.js'),'utf8');
          assert.equal(crypto.createHash('sha256').update(source).digest('hex'),'05a665936b82cf8a930ee92fd83e17b4da4362eb13339b2ddeb20443b5b13bc0');
          assert.match(source,/if\s*\(\s*__DEV__\s*\)\s*\{\s*assertWorkletsVersion\(\)/);
          assert.equal((source.match(/assertWorkletsVersion\(\)/g)||[]).length,1);
          console.log('Frozen caller invokes the replaced import only within its __DEV__ guard');
          NODE
      - name: Export paired production web builds
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build --clear)
          (cd candidate && bun run --cwd packages/frontend build --clear)
      - name: Compare production budgets
        run: |
          echo Baseline
          (cd base && bun scripts/check-web-export-budget.mjs packages/frontend/dist) || true
          echo Candidate
          (cd candidate && bun scripts/check-web-export-budget.mjs packages/frontend/dist) || true
      - name: Verify candidate module graph from a separate source-map export
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd candidate
          bun run --cwd packages/frontend build --clear --source-maps
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),assert=require('assert');
          const root='packages/frontend/dist';
          const all=[];
          function scanMap(map){ for(const section of map.sections||[]) scanMap(section.map); all.push(...(map.sources||[])); }
          function walk(dir){ for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name); if(e.isDirectory())walk(p);else if(p.endsWith('.js.map'))scanMap(JSON.parse(fs.readFileSync(p,'utf8')));}}
          walk(root);
          const semver=all.filter(s=>s.includes('/node_modules/semver/'));
          const stub=all.filter(s=>s.includes('reanimated-dev-assert-stub'));
          const caller=all.filter(s=>s.includes('/js-reanimated/JSReanimated.js'));
          console.log(JSON.stringify({semver:semver.length,stub:stub.length,caller:caller.length}));
          assert.equal(semver.length,0); assert.ok(stub.length>0); assert.ok(caller.length>0);
          NODE
