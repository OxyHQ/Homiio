name: Reservation focused entry paired diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6d2e02f2692e654c6285e3d24d6a365c18454bd6
          path: base
      - uses: actions/checkout@v7
        with:
          ref: 977427b7a451d881c2c833185ee901dc6167d450
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact inputs and the isolated source change
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 6d2e02f2692e654c6285e3d24d6a365c18454bd6
          test "$(git -C candidate rev-parse HEAD)" = 977427b7a451d881c2c833185ee901dc6167d450
          git -C candidate fetch --no-tags --depth=1 origin 6d2e02f2692e654c6285e3d24d6a365c18454bd6
          git -C candidate diff --name-only 6d2e02f2692e654c6285e3d24d6a365c18454bd6 HEAD | tee "$RUNNER_TEMP/changed-files"
          test "$(sha256sum "$RUNNER_TEMP/changed-files" | cut -d' ' -f1)" = 28251380fb2002c85d9159b2b5e1c6e3c4fedccbd96abb1c2087039cb0208d46
          git -C candidate diff --exit-code 6d2e02f2692e654c6285e3d24d6a365c18454bd6 HEAD -- bun.lock performance-budgets.json packages/frontend/package.json package.json
      - name: Install frozen dependencies in both trees
        run: |
          set -euo pipefail
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Export both production web builds
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build)
          (cd candidate && bun run --cwd packages/frontend build)
      - name: Compare budgets and enforce candidate
        run: |
          echo 'Baseline (failure is expected)'
          (cd base && bun scripts/check-web-export-budget.mjs packages/frontend/dist) || true
          echo Candidate
          cd candidate
          bun scripts/check-web-export-budget.mjs packages/frontend/dist
