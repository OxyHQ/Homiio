name: Profile ordering diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Reproduce same-owner ordering with real profile provider and linked HTTP
        run: bun run --cwd packages/frontend test --runInBand profileAccountIsolation.test.tsx
