# CI — the workflow that runs on a pull request.
#
# Until this existed, `deploy-aws.yml` and `deploy-frontends.yml` were the only
# workflows and both are `push: [main]`, so the checks on a PR were CodeQL,
# Socket and Cursor — and **nothing executed the test suite or the typechecker**.
# Every guard in the backend was therefore a comment as far as the next pull
# request was concerned.
#
# Two things were still missing after the backend job below landed, and both are
# now here:
#
#   - Only the backend was covered. The frontend's suite and its web bundle ran
#     for nobody, and a suite that runs zero tests exits 0, so every job that
#     runs one carries a count floor.
#   - A push to main still deployed to production ECS and to Cloudflare Pages
#     regardless of this workflow. Both are gated on it now, by two different
#     mechanisms and for a measured reason — see `deploy-backend` at the bottom
#     of this file and the header of deploy-frontends.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run proves nothing about the commit that replaced it — on a pull
# request. On main it proves something that cannot be re-derived: whether the
# ROLLOUT it started finished.
#
# `deploy-backend` at the bottom of this file CALLS deploy-aws.yml, and a called
# workflow runs inside the caller's run. So cancelling a run on main cancels the
# deploy job with it, in the middle of whatever it was doing —
# `docker buildx --push`, `aws ecs update-service`, or the wait that watches the
# rollout reach a steady state. deploy-aws.yml declares `cancel-in-progress:
# false` on its own group precisely to prevent that, and it could not: an inner
# group cannot save a job whose parent run was cancelled.
#
# It happened twice on 2026-08-09, minutes apart, while main was busy: runs
# `31300943279` and `31301131928` both had their deploy job cancelled by the next
# merge. The first survived by timing alone — its API rollout had already reached
# `rolloutState: COMPLETED` seconds earlier; its worker lane had not started. A
# cancel landing between `update-service` and the wait is the exact case
# deploy-aws.yml's comment describes, and nothing prevented it.
#
# The backend is only the loud half. deploy-frontends.yml triggers on
# `workflow_run` with `conclusion == 'success'`, and a CANCELLED run is not a
# successful one — so every cancelled run on main also silently skips the
# frontend deploy, leaving the two halves of a wire contract on different
# commits. That failure has already been paid for once in this repository (see
# the `_id` -> `id` incident), and it produces no red job anywhere.
#
# So cancellation is now scoped to the refs that do not deploy. Pull requests
# keep the fast-cancel behaviour; a run on main that has STARTED is never
# cancelled, which is what "serialize production rollouts" has meant in
# deploy-aws.yml all along.
#
# WHAT THIS DOES NOT DO, MEASURED, because the previous version of this comment
# claimed the opposite and a safety argument now leans on it. It said pushes to
# main "QUEUE behind each other" and that "main's deploys run one after another
# instead of the newest winning". They do not. `cancel-in-progress` governs the
# IN-PROGRESS run only; a run still PENDING in the group is evicted by the next
# push, and at most one pending run is ever retained. On 2026-08-10 runs
# `31376441022` (a3213af2, 09:50:10Z) and `31376457516` (873c3e25, 09:50:23Z)
# were both `cancelled` while `31376855242` (ff4f04c3, 09:55:41Z) went on to
# run. Both cancelled runs report ZERO jobs — they never started one. So the
# newest DOES win; what is guaranteed is only that a run already executing is
# left alone.
#
# Eviction is not rare, and the rate belongs beside the claim: 27 of the last 100
# CI runs on main concluded `cancelled` (measured 2026-08-11), every one of them
# with zero jobs. Roughly one main push in four never starts.
#
# For a rollout that is the property that matters: a run that never started
# never called `update-service` and never started a migrator, so nothing is left
# half-done. The cost lands on the NEXT run, and #430 is what that cost turned
# into once #417 armed migrations.
#
# An intermediate commit's deploy can be dropped entirely, so the next run has to
# carry it. `deployment-scope.sh` used to read a single commit
# (`<sha>^1..<sha>`), which meant a documentation-only winner deployed nothing at
# all and the dropped commit's changes waited for the next code merge — measured
# at up to FOUR consecutive documentation commits on real history, so the wait
# was unbounded rather than merely long. With a migration in the dropped commit
# that is a schema sitting behind the code with main green, which is the silent
# shape this repository has already paid for once.
#
# **The backend no longer skips**: `deployment-scope.sh backend` always emits
# `true`, so an evicted commit is picked up by whatever lands next regardless of
# what that commit touched. The measurements behind deleting the optimisation
# rather than making it stateful are in that script's header, and the pairing is
# pinned by `.github/scripts/test-deployment-scope.sh`.
#
# The FRONTEND still skips, deliberately: deploy-frontends.yml triggers on
# `workflow_run` with `conclusion == 'success'`, so a cancelled run already skips
# it, and the same combination costs a stale bundle rather than a schema/code
# split.
#
# The reason is FREQUENCY, not the cost of the export. An earlier version of this
# paragraph said "an hour-long web export"; measured on run 31449277315 the
# export is **59 seconds** and the whole `deploy-frontend` job is **102**. The
# hour was `timeout-minutes: 60` read as a duration — a ceiling, not a cost. What
# actually separates the two arms is that the frontend skip avoids 100 of 200
# commits against the backend's 10, with a longest skip streak of 34, and that
# what it strands is a bundle the next frontend commit republishes rather than a
# schema sitting unapplied under green CI.
#
# It is a trade rather than an oversight — and at 102 seconds it is a closer one
# than it looked, so #435 carries the hazard, the numbers and the options. It IS
# the same mechanism, and if a wire contract ever splits across it, this is the
# paragraph to come back to.
concurrency:
  group: ci-${{ github.ref }}
  # An EXPRESSION, and a mistyped one degrades silently to falsy — which would
  # stop pull-request CI cancelling and queue it instead, slower but green, so
  # nothing would report it. Verified on real runs, not by reading this line:
  # `packages/backend/__tests__/unit/deployRolloutConcurrency.test.ts` pins the
  # two-file invariant, and the PR that introduced it pushed twice in quick
  # succession to confirm the earlier run still concludes `cancelled`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Same bun as deploy-frontends.yml AND packages/backend/Dockerfile. A lockfile
  # read by two different bun versions is how `lockfile had changes, but lockfile
  # is frozen` arrives in a deploy that changed nothing.
  #
  # The Dockerfile used to be exempt on the grounds that it narrows `workspaces`
  # and never copies bun.lock, resolving fresh from the version ranges. That is
  # true and it is the argument FOR pinning it, not against: with no lockfile the
  # bun version is the only thing deciding how those ranges resolve, so an
  # unpinned install lets an identical commit produce different images. It is a
  # third pin now, and `.github/scripts/check-version-pins.sh` is what keeps the
  # three in step instead of goodwill.
  BUN_VERSION: '1.3.14'

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      # The Postgres server `jest.globalSetup.ts` creates one throwaway,
      # fully-migrated database per worker on. Separate from DATABASE_URL so the
      # harness never has to guess which server it may create databases on.
      TEST_DATABASE_URL: postgres://homiio:homiio@127.0.0.1:5434/postgres
    # Postgres is the only store the suite needs; the Mongo replica set this job
    # used to boot went with `mongodb-memory-server`.
    services:
      postgres:
        # The SAME pin as docker-compose.postgres.yml, on BOTH versions. A
        # floating PostGIS minor is a floating set of function volatilities, and
        # this schema depends on `ST_MakePoint` and the geometry→geography cast
        # being IMMUTABLE (a generated column requires it), so a developer's
        # database and CI's must not be able to disagree about what is installed.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: homiio
          POSTGRES_PASSWORD: homiio
          POSTGRES_DB: homiio_dev
        ports:
          # 5434 on the host, matching the compose file, so TEST_DATABASE_URL is
          # the same string a developer uses.
          - 5434:5432
        # Without these the job races the server's first boot: the container is
        # "started" long before Postgres accepts a connection, and global setup
        # would fail on the first CREATE DATABASE rather than waiting.
        options: >-
          --health-cmd "pg_isready -U homiio -d homiio_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `--frozen-lockfile` here, where it belongs: this job wants the exact
      # graph the lockfile records. It is NOT a sync check and must never be
      # mistaken for one — that is the `lockfile` job below, which needs a plain
      # install and therefore cannot share this one. Scripts stay enabled so the
      # root postinstall builds shared-types, which the steps below assume.
      - name: Install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile

      # `shared-types` is built by the root postinstall; `listing-providers` is
      # not, and the backend typecheck resolves it through project references —
      # without this, tsc reports TS6305 in files nobody touched, which reads
      # exactly like somebody else's broken commit.
      - name: Build listing-providers
        run: bun run --filter @homiio/listing-providers build

      # Pointed at the BACKEND project, never the root `tsconfig.json`: the root
      # is composite and references the frontend, so a root typecheck would be
      # permanently red and teach everyone to ignore a red job.
      #
      # This DOES cover `__tests__` and `scripts`. It did not until the exclusion
      # came out of that project — between it and ts-jest's `isolatedModules`,
      # nothing in this repository had ever typechecked a test file, so a
      # deliberate `const x: number = 'string'` in one produced no errors at all.
      # Keeping tests out of `dist` is a question about EMIT, and it is answered
      # by `tsconfig.build.json`, which is what `build` runs.
      - name: Typecheck backend
        run: bun x tsc --noEmit -p packages/backend/tsconfig.json

      # Before the suite, because it needs no database and it is the cheapest
      # possible failure. A migration with no `-- oxy:deploy-phase=` marker is
      # refused at migration TIME too, so without this gate the first thing to
      # notice would be a production deploy.
      - name: Verify every migration declares a deploy phase
        run: bun .github/scripts/check-migration-phases.mjs packages/backend/drizzle

      - name: Test backend
        run: >-
          bun run --cwd packages/backend test --
          --json --outputFile="$RUNNER_TEMP/backend-tests.json"

      # A suite that runs nothing exits 0. See the floor script's header; the
      # short version is that a wrong working directory, a renamed script or a
      # glob that stops matching all produce an empty green run, and that reads as
      # coverage forever because nothing contradicts it.
      #
      # RAISED FROM 1450 TO 1520 by the privacy-safe observability work (#350),
      # which added 73 tests across three backend files: the redaction and
      # event-schema suite, the ingest suite, and the location/housing-identity
      # divergence invariants. Measured 1680 -> 1753. Same convention as every
      # step below — keep roughly the headroom the previous figure carried.
      #
      # RAISED FROM 1415 TO 1450 by the ViewingRequest stragglers (the
      # retention sweep and the owner analytics). Before that it went
      # 1380 -> 1415 for the reservations port — the last tenancy
      # table — which added `reservations.test.ts`. Before that it went
      # 1345 -> 1380 for the exchanges port, which added
      # `exchangeRequests.test.ts` — measured 1398 -> 1424. Before that it went
      # 1310 -> 1345 for the viewings + applications port, which
      # added two real-database suites — measured 1352 -> 1389. Before that it
      # went 1225 -> 1310 for the lease port, which added
      # `leasePaymentSchedule.test.ts` and rewrote `leaseOwnership.test.ts`
      # against the real Postgres — measured 1320 -> 1351. Before that it went
      # 1190 -> 1225 for the first zero-row domain port
      # (notifications, saved searches, roommate requests/relationships), which
      # added `savedSearches.test.ts` and rewrote two Mongo-seeded suites
      # against the real Postgres — measured 1233 -> 1264. Before that it went
      # 1150 -> 1190 for the geo backfill, which added 36 tests in
      # `__tests__/db/geoBackfill.test.ts` (measured 1190 -> 1226); and
      # 1100 -> 1150 for the remaining-schema batch (#281), which added
      # 54 tests across 4 files under `__tests__/db/` and took the measured
      # count 1123 -> 1177. Each step keeps roughly the headroom the previous
      # figure carried rather than pinning the exact total. The floor is a
      # MINIMUM: raise it as suites grow, and lower it only deliberately, in the
      # same change that removes the tests.
      - name: Assert the suite actually ran
        if: always()
        run: >-
          bun .github/scripts/assert-test-floor.mjs
          "$RUNNER_TEMP/backend-tests.json" packages/backend 1520

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The root postinstall builds shared-types, which these tests import by
      # package name and therefore resolve through its BUILT dist.
      - name: Install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile

      - name: Test frontend
        run: >-
          bun run --cwd packages/frontend test --
          --json --outputFile="$RUNNER_TEMP/frontend-tests.json"

      # RAISED FROM 43 TO 110 by the i18n formatting module (#357): 75 tests for
      # `format/{money,units,dates,percentage}` plus the 4-case
      # hardcoded-currency gate, against 5 removed with the locale-blind
      # `formatCurrency` they covered.
      #
      # It went 38 -> 43 just before, for #350's cross-package observability
      # contract test, which is what proves the shared redaction layer resolves
      # and behaves from THIS workspace rather than only from the backend's
      # (measured 40 -> 45). Same convention as the backend floor above: a
      # MINIMUM, raised as suites grow and lowered only in the change that
      # removes the tests.
      - name: Assert the suite actually ran
        if: always()
        run: >-
          bun .github/scripts/assert-test-floor.mjs
          "$RUNNER_TEMP/frontend-tests.json" packages/frontend 110

  # Deliberately no job for shared-types or listing-providers. shared-types' `test`
  # script is `echo "No tests specified" && exit 0` — there is no suite. And
  # listing-providers' is `cd ../backend && bun run test -- --testPathPattern=...`:
  # it re-runs a FILTERED SUBSET of the backend suite that the backend job above
  # already runs in full, so a job for it would be duplicated minutes, not extra
  # coverage. Give either package a suite of its own and it earns a job with a floor.

  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Its own job because it needs a PLAIN install, which no other job here
      # wants. The script runs that install itself and hands the lockfile back
      # unchanged.
      #
      # This REPLACES the inline `git diff --quiet -- bun.lock` that used to sit
      # in the backend job. That check was right about `--frozen-lockfile` failing
      # open, and it catches a widened range — but a plain `bun install` does NOT
      # rewrite a stale recorded workspace `version`, so it is blind to the other
      # desync shape that reaches main. The script keeps the install-and-ask-git
      # layer and adds a direct comparison of what bun.lock records per workspace
      # against the manifests.
      - name: Verify bun.lock was committed with its manifest change
        run: bun run check:lockfile

      # Every gate in this repository carries a mutation test that breaks what it
      # guards and fails if the guard still passes. Running them is what keeps a
      # gate that has silently stopped discriminating from reading as coverage.
      # Toolchain versions are pinned in three files (this one, the backend
      # Dockerfile, package.json's engines). Drift between them is silent by
      # nature, so it is checked rather than remembered.
      - name: Verify the toolchain pins have not drifted
        run: bash .github/scripts/check-version-pins.sh

      # The documentation gate. Its own step rather than a job, because it needs
      # nothing this job has not already installed — no Postgres, no build — and a
      # whole job for one markdown scan is minutes of queue time for seconds of
      # work.
      #
      # It is a REAL gate and not a linter: `main` has carried a README badge
      # advertising a datastore this repository does not use, an API page whose
      # every response example used a field name the wire contract forbids, and a
      # contributing guide telling people to add an index type that does not
      # exist here. None of that breaks a test, which is exactly why it survived.
      - name: Verify the documentation still describes this repository
        run: bun run check:docs

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever. It reached 52 KB here by accretion — a subsystem
      # walkthrough appended by the branch that shipped it, none of them wrong on
      # its own and none visible except in the sum. Same shape as the docs gate
      # above: nothing breaks, which is why it survives. Reads the tracked file
      # listing and nothing else.
      - name: Verify the AGENTS.md budget
        run: bun run validate:agents-md

      - name: Verify the CI and deploy gates can still fail
        run: |
          bash -n .github/scripts/*.sh
          bun scripts/test-check-lockfile-sync.mjs
          bun scripts/test-check-docs.mjs
          bun .github/scripts/test-assert-test-floor.mjs
          bun .github/scripts/test-check-migration-phases.mjs
          bash .github/scripts/test-assert-install-clean.sh
          bash .github/scripts/test-deployment-scope.sh
          bash .github/scripts/test-check-version-pins.sh
          bash .github/scripts/test-deploy-ecs-image.sh

  frontend-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile

      # The same export deploy-frontends.yml runs, with the same environment, so a
      # broken web build fails on the pull request instead of after the merge that
      # ships it. Expo compiles through Babel and therefore does NOT typecheck the
      # frontend — this proves the bundle builds, nothing more.
      - name: Export production web bundle
        run: bun run --cwd packages/frontend build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

  lint:
    # ARMED. `bun run lint` exits 0 across all four packages.
    #
    # It was gated on `vars.HOMIIO_LINT_GATE == 'ready'` from #254 until this
    # commit, and that variable was never set — at the repository or the org —
    # so the job was SKIPPED on every run it ever appeared in. A skipped job is
    # not a neutral outcome on a pull request: `gh pr checks` prints it as
    # `skipping` in the same list as the passes, the run concludes `success`,
    # and any check that counts failures rather than naming the jobs it expects
    # reads the whole thing as green. The presence of a job says nothing about
    # what it ran.
    #
    # The debt the switch was waiting on is gone, and not because a rule was
    # relaxed: no severity in any of the four eslint configs has changed since
    # #254. `require(` in backend `.ts` went 268 -> 15 while the package GREW
    # from 302 to 449 files, which is the Postgres port paying off the 272
    # `no-require-imports` that made up most of the original 344.
    #
    # Measured on this commit, `bun run lint`: backend 0 errors / 102 warnings,
    # frontend 0 / 23, listing-providers and shared-types clean. Warnings do not
    # fail the job. That is deliberate for now and it is a REAL gap — nothing
    # here stops the warning count growing — but 101 of the 102 backend warnings
    # are `@typescript-eslint/no-explicit-any`, and pinning a ceiling before
    # those are typed would only teach the next person to raise the ceiling.
    #
    # NOTHING IS BUILT IN THIS JOB, ON PURPOSE — eslint does not typecheck, so a
    # build buys nothing and costs minutes. The generated output that used to
    # make this dangerous (`bun run lint` reporting 344 on a clean tree and 558
    # after `bun run build`) is now excluded by `ignores: ['dist/**']` in the
    # backend and frontend configs rather than by hoping nobody builds first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Scripts stay ENABLED so the root postinstall builds shared-types. Not for
      # types — eslint does not typecheck — but because the frontend's config
      # carries eslint-plugin-import, which resolves modules for real and would
      # report @homiio/shared-types as unresolved without its dist. Building
      # shared-types is safe here; what must not happen is building the BACKEND,
      # per the note above.
      - name: Install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Lint every package
        run: bun run lint

  frontend-typecheck:
    # ARMED. Nothing else typechecks the frontend: `expo export` compiles
    # through Babel, which strips types without checking them, so the
    # frontend-bundle job proves the bundle builds and nothing more.
    #
    # It is armed unconditionally rather than behind a repository variable. A
    # variable is the right shape for a job that is red on arrival and needs a
    # human to decide when to switch it on; this one exits 0, and leaving the
    # switch in place would only mean the next person to make it red can turn it
    # off instead of fixing it.
    #
    # The ten errors it used to report were not stylistic. Two screens omitted a
    # REQUIRED `t` prop, so `t(key)` was calling `undefined` — a crash on
    # /applications and /stays that no test covers.
    #
    # The install runs postinstall so shared-types is built — this project
    # resolves it through a path mapping to ../shared-types/src, but its
    # references still expect the built project.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Typecheck frontend
        run: bun run --cwd packages/frontend typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # The backend deploy runs HERE, as a called workflow, rather than from its own
  # `workflow_run` trigger like the frontend's.
  #
  # That asymmetry is not a preference, it is a measured failure. On `e94bd65`,
  # deploy-aws.yml on `workflow_run` produced `conclusion: action_required` with
  # ZERO jobs created, twice, with created_at == updated_at — concluded before
  # scheduling anything, including its own ubuntu-latest scope job. The same
  # trigger on deploy-frontends.yml, in the same repository and the same instant,
  # ran to success. Ruled out by evidence: the ARM runner (this file's own
  # push-triggered runs used it minutes earlier), rulesets, and environment
  # protection rules (none exist).
  #
  # The cause was in the YAML shape after all, and the two observations taken to
  # rule that out did not: deploy-aws.yml expanded the whole `secrets` context
  # with `toJSON(secrets)` and walked it into a shell loop, which GitHub's abuse
  # detection reads as an exfiltration payload and holds pending a human click.
  # deploy-frontends.yml has no such step, and the "identical" CrowdSource
  # deploy-aws.yml is not identical — it syncs from an explicit
  # `SSM_SECRET_ALLOWLIST` and never builds the blob. Both "controls" differ from
  # this file in precisely that line. It is not org-level Actions policy.
  #
  # deploy-aws.yml no longer builds that blob, so the `workflow_run` trigger is
  # very likely usable again. It is deliberately NOT restored here: being called
  # is the stronger gate for the reasons below, and re-testing a production
  # deploy trigger is a separate change from removing the pattern.
  #
  # Calling the workflow removes the failing mechanism entirely and is a stronger
  # gate besides: the deploy cannot start unless every job below it passed in
  # THIS run, with no window in which main moves on between CI concluding and the
  # deploy resolving a SHA. It also fails LOUDLY — a blocked deploy shows up
  # inside the CI run on main, rather than in a separate run that quietly says
  # action_required and that nobody is watching.
  #
  # deploy-frontends.yml is deliberately left on `workflow_run`: it demonstrably
  # works, and rewiring a working production deploy for symmetry is risk with no
  # return. If it ever exhibits the same conclusion, move it here too.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend to AWS
    # `lint` IS DELIBERATELY ABSENT FROM `needs`. Do not add it for symmetry.
    #
    # The five listed here are correctness gates — a red one means the code is
    # wrong. `lint` is a quality gate, and a style or typing finding should not
    # hold a production rollout.
    #
    # This is NOT a statement about lint being unable to see a direct push. It
    # can: `lint` carries no `if:`, and this workflow triggers on `push:
    # branches: [main]` as well as `pull_request`, so lint runs on every push to
    # main whether or not it arrived through a pull request. Verified on run
    # 31447194657 — `event=push`, `branch=main`, `lint: success` — which is the
    # run that first executed it on the trunk after #425 armed it.
    #
    # So the coupling is only the one stated above: on main, lint runs beside
    # this job rather than before it, and a lint failure is loud without being
    # blocking. If that is ever the wrong trade, the change is to add `lint` to
    # this list on purpose, not to assume it is missing by oversight.
    needs: [backend, frontend, frontend-typecheck, lockfile, frontend-bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    # The deploy syncs named GitHub secrets to SSM, so it needs the caller's
    # secrets; without `inherit` every one of them reads as empty and the sync
    # silently writes nothing. Still required now that the step enumerates them
    # by name rather than expanding the whole context.
    secrets: inherit
    uses: ./.github/workflows/deploy-aws.yml
