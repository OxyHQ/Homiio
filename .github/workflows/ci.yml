name: Reservation owner rebase paired budget diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ee32e652a8c06dd3b3524247190a8a85167896d2
          path: base
      - uses: actions/checkout@v7
        with:
          ref: 6d2e02f2692e654c6285e3d24d6a365c18454bd6
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact heads and unchanged inputs
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = ee32e652a8c06dd3b3524247190a8a85167896d2
          test "$(git -C candidate rev-parse HEAD)" = 6d2e02f2692e654c6285e3d24d6a365c18454bd6
          git -C candidate fetch --no-tags --depth=1 origin ee32e652a8c06dd3b3524247190a8a85167896d2
          git -C candidate diff --name-only ee32e652a8c06dd3b3524247190a8a85167896d2 HEAD | tee "$RUNNER_TEMP/changed-files"
          test "$(sha256sum "$RUNNER_TEMP/changed-files" | cut -d' ' -f1)" = e601ccba96c7d783e6258bc7139a3932572bb677ff5348326ac5480f712294ab
          git -C candidate diff --exit-code ee32e652a8c06dd3b3524247190a8a85167896d2 HEAD -- bun.lock performance-budgets.json packages/frontend/package.json package.json
      - name: Install frozen dependencies in both trees
        run: |
          set -euo pipefail
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Export both production web builds
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build)
          (cd candidate && bun run --cwd packages/frontend build)
      - name: Compare baseline and enforce candidate budget
        run: |
          echo Baseline
          (cd base && bun scripts/check-web-export-budget.mjs packages/frontend/dist)
          echo Candidate
          cd candidate
          bun scripts/check-web-export-budget.mjs packages/frontend/dist
