name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chart-barrel-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify frozen production inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages scripts .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export baseline
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          bun run --cwd packages/frontend build --clear
          mv packages/frontend/dist /tmp/homiio-chart-baseline
      - name: Narrow chart barrel only on this diagnostic runner
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const fromApp = createRequire(path.resolve('packages/frontend/package.json'));
          const manifest = fromApp.resolve('@oxy.so/bloom/package.json');
          const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          if (pkg.version !== '15.53.0') throw new Error('Unexpected Bloom version');
          const barrel = path.join(path.dirname(manifest), 'lib/module/chart-cards/index.js');
          const before = fs.readFileSync(barrel, 'utf8');
          for (const name of ['BarListCard', 'LineChartCard', 'ChartCardSurface', 'ChartHeadline', 'ChartStatTiles']) {
            if (!before.includes(name)) throw new Error(`Missing ${name} from baseline barrel`);
          }
          fs.writeFileSync(barrel, [
            'export { BarListCard } from "./BarListCard.js";',
            'export { LineChartCard } from "./LineChartCard.js";',
            'export { ChartCardSurface } from "./primitives/ChartCardSurface.js";',
            'export { ChartHeadline } from "./primitives/ChartHeader.js";',
            'export { ChartStatTiles } from "./primitives/ChartStatTiles.js";',
            ''
          ].join('\n'));
          console.log(`Temporarily narrowed ${barrel}; no package is published`);
          JS
      - name: Export diagnostic candidate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --clear
      - name: Compare the unchanged production budget on both exports
        run: |
          echo 'Baseline metrics:'
          bun scripts/check-web-export-budget.mjs /tmp/homiio-chart-baseline || true
          echo 'Candidate metrics:'
          bun scripts/check-web-export-budget.mjs packages/frontend/dist || true
