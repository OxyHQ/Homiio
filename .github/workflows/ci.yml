name: Saved search bundle source inventory diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72399aaa47fd890b853e8ad76175c8f2af14452c
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact source and install frozen dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 72399aaa47fd890b853e8ad76175c8f2af14452c
          bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export source map
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --source-maps
      - name: Inventory resolved modules (not bundle size)
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const root = 'packages/frontend/dist';
          const walk = (dir) => fs.readdirSync(dir, {withFileTypes:true}).flatMap((e) => e.isDirectory() ? walk(path.join(dir,e.name)) : [path.join(dir,e.name)]);
          const maps = walk(root).filter((f) => f.endsWith('.js.map'));
          if (!maps.length) throw Error('No JavaScript source map');
          const groups = new Map();
          const sample = [];
          const appFiles = [];
          let missing = 0;
          function visit(map) {
            if (Array.isArray(map.sections)) for (const section of map.sections) section.map ? visit(section.map) : missing++;
            if (!Array.isArray(map.sources)) { if (!Array.isArray(map.sections)) missing++; return; }
            for (const name of map.sources) {
              if (sample.length < 8) sample.push(name);
              const pkg=name.match(/node_modules\/(?:\.bun\/[^/]+\/node_modules\/)?(@[^/]+\/[^/]+|[^/]+)/)?.[1] ?? '(app)';
              const bloom=name.match(/@oxy\.so\/bloom\/lib\/module\/([^/]+)/)?.[1];
              const key=bloom ? `${pkg}/${bloom}` : pkg;
              const item=groups.get(key) ?? {count:0,sourceBytes:0,unresolved:0};
              item.count++;
              const filename=path.resolve(process.cwd(), `.${name}`);
              if (filename.startsWith(process.cwd()+path.sep) && fs.existsSync(filename) && fs.statSync(filename).isFile()) {
                const size=fs.statSync(filename).size;
                item.sourceBytes+=size;
                if (name.startsWith('/packages/frontend/') && /\.(?:ts|tsx|js|jsx)$/.test(name)) appFiles.push({name,size});
              } else item.unresolved++;
              groups.set(key,item);
            }
          }
          for (const file of maps) visit(JSON.parse(fs.readFileSync(file, 'utf8')));
          if (!groups.size) throw Error('No source names in any map section');
          console.log('Sections without embedded source names:', missing);
          console.log('Module counts and on-disk source bytes only; neither measures bundle contribution or removal savings.');
          console.log('Sample source names',JSON.stringify(sample));
          console.log('Largest local sources (not bundle savings)',JSON.stringify(appFiles.sort((a,b)=>b.size-a.size).slice(0,45)));
          console.log(JSON.stringify([...groups].map(([name,data]) => ({name,...data})).sort((a,b)=>b.sourceBytes-a.sourceBytes).slice(0,100),null,2));
          NODE
