name: Right rail focused import paired diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72399aaa47fd890b853e8ad76175c8f2af14452c
          path: base
      - uses: actions/checkout@v7
        with:
          ref: 869658524c9700829f178217c870005ebbe21e42
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: driver
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact inputs and the isolated source change
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 72399aaa47fd890b853e8ad76175c8f2af14452c
          test "$(git -C candidate rev-parse HEAD)" = 869658524c9700829f178217c870005ebbe21e42
          git -C candidate fetch --no-tags --depth=1 origin 72399aaa47fd890b853e8ad76175c8f2af14452c
          git -C candidate diff --name-only 72399aaa47fd890b853e8ad76175c8f2af14452c HEAD > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' packages/frontend/__tests__/widgets/rightBarRail.test.tsx packages/frontend/components/RightBar.tsx packages/frontend/components/widgets/WidgetManager.tsx > "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          git -C candidate diff --exit-code 72399aaa47fd890b853e8ad76175c8f2af14452c HEAD -- bun.lock performance-budgets.json packages/frontend/package.json package.json
      - name: Install frozen dependencies in both trees
        run: |
          set -euo pipefail
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Test full frontend and types without forced exit
        run: |
          set -euo pipefail
          cd candidate
          bun run --cwd packages/frontend test -- --json --outputFile="$RUNNER_TEMP/frontend-tests.json"
          bun .github/scripts/assert-test-floor.mjs "$RUNNER_TEMP/frontend-tests.json" packages/frontend 110
          bun run --cwd packages/frontend typecheck
      - name: Export both production web builds
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build)
          (cd candidate && bun run --cwd packages/frontend build)
      - name: Compare budgets and enforce candidate
        run: |
          echo 'Baseline (failure is expected)'
          (cd base && bun scripts/check-web-export-budget.mjs packages/frontend/dist) || true
          echo Candidate
          cd candidate
          bun scripts/check-web-export-budget.mjs packages/frontend/dist
      - name: Instrument widget initialization in CI-local copies
        run: node driver/scripts/diagnostics/compare-widget-init.cjs instrument
      - name: Export instrumented web builds with source maps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build --clear --source-maps)
          (cd candidate && bun run --cwd packages/frontend build --clear --source-maps)
      - name: Compare source sets and browser initialization order
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node driver/scripts/diagnostics/compare-widget-init.cjs verify
