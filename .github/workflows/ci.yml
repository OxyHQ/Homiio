name: Right rail native JS graph diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72399aaa47fd890b853e8ad76175c8f2af14452c
          path: base
      - uses: actions/checkout@v7
        with:
          ref: bdc35dfd77b3af40f0361e373d06af66032c52fb
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: driver
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact sources and frozen inputs
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 72399aaa47fd890b853e8ad76175c8f2af14452c
          test "$(git -C candidate rev-parse HEAD)" = bdc35dfd77b3af40f0361e373d06af66032c52fb
          cmp base/bun.lock candidate/bun.lock
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Export iOS JavaScript and compare widget source graph
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base/packages/frontend && bunx expo export --platform ios --source-maps --output-dir "$RUNNER_TEMP/base-ios")
          (cd candidate/packages/frontend && bunx expo export --platform ios --source-maps --output-dir "$RUNNER_TEMP/candidate-ios")
          node driver/scripts/diagnostics/compare-widget-init.cjs sources "$RUNNER_TEMP/base-ios" "$RUNNER_TEMP/candidate-ios"
      - name: Export Android JavaScript and compare widget source graph
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base/packages/frontend && bunx expo export --platform android --source-maps --output-dir "$RUNNER_TEMP/base-android")
          (cd candidate/packages/frontend && bunx expo export --platform android --source-maps --output-dir "$RUNNER_TEMP/candidate-android")
          node driver/scripts/diagnostics/compare-widget-init.cjs sources "$RUNNER_TEMP/base-android" "$RUNNER_TEMP/candidate-android"
