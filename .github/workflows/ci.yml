name: Civil date diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Frozen date parser and production export comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify package inputs match main
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh performance-budgets.json
      - name: Frozen install
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Compare old and new parsing across local time zones
        run: |
          set -euo pipefail
          for zone in UTC Europe/Madrid America/New_York Pacific/Apia Australia/Lord_Howe; do
            echo "Testing $zone"
            TZ="$zone" bun run --cwd packages/frontend test --runInBand parseCalendarDate.test.ts
          done
      - name: Export unchanged baseline
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          for file in packages/frontend/components/property/create/LocationStep.tsx packages/frontend/components/reviews/write/StepPriceDates.tsx; do git show "0fab9c18ac2ddf20d1a7c7c6860523cb5411c194:$file" > "$file"; done
          bun run --cwd packages/frontend build --clear
          mv packages/frontend/dist "$RUNNER_TEMP/date-baseline"
          git checkout HEAD -- packages/frontend/components/property/create/LocationStep.tsx packages/frontend/components/reviews/write/StepPriceDates.tsx
      - name: Export candidate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --clear
      - name: Compare complete web budget
        run: |
          echo 'Baseline:'
          bun scripts/check-web-export-budget.mjs "$RUNNER_TEMP/date-baseline" || true
          echo 'Candidate:'
          bun scripts/check-web-export-budget.mjs packages/frontend/dist || true
      - name: Export candidate source maps
        working-directory: packages/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bunx expo export --platform web --output-dir "$RUNNER_TEMP/date-maps" --source-maps --clear
      - name: Verify parse module absent from candidate
        run: |
          node - <<'NODE'
          const fs = require('node:fs'); const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP,'date-maps');
          let maps=0, parse=0, parseISO=0;
          function visit(map) { if (map.sections) return map.sections.forEach(s => visit(s.map)); for (const source of map.sources ?? []) { if (/node_modules\/date-fns\/parse(?:\/|\.js)/.test(source)) parse++; if (/node_modules\/date-fns\/parseISO\.js/.test(source)) parseISO++; } }
          for (const name of fs.readdirSync(root,{recursive:true})) if (name.endsWith('.map')) { maps++; visit(JSON.parse(fs.readFileSync(path.join(root,name)))); }
          console.log(JSON.stringify({maps,parse,parseISO}));
          if (!maps || parse || !parseISO) throw Error('Unexpected date-fns modules in candidate');
          NODE
