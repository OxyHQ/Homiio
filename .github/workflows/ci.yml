name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcemap-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify production source and lock inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages scripts .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export production web bundle with diagnostic source maps
        run: bun run --cwd packages/frontend build --source-maps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
      - name: Upload diagnostic source maps
        uses: actions/upload-artifact@v4
        with:
          name: homiio-main-0fab9c-source-maps
          path: packages/frontend/dist/**/*.js.map
          if-no-files-found: error
          retention-days: 1
