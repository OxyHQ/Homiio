name: Profile marker diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Repeat provider and screen tests with warning attribution
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "Provider run $run"
            bun run --cwd packages/frontend test --runInBand --runTestsByPath __tests__/profileAccountIsolation.test.tsx __tests__/roommatePreferencesCombined.test.tsx __tests__/roommateProfileOwner.test.tsx
          done
