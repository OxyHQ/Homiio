name: Saved search bundle source inventory diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72399aaa47fd890b853e8ad76175c8f2af14452c
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact source and install frozen dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 72399aaa47fd890b853e8ad76175c8f2af14452c
          bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export source map
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --source-maps
      - name: Inventory source bytes (not bundle savings)
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), zlib = require('zlib');
          const root = 'packages/frontend/dist';
          const walk = (dir) => fs.readdirSync(dir, {withFileTypes:true}).flatMap((e) => e.isDirectory() ? walk(path.join(dir,e.name)) : [path.join(dir,e.name)]);
          const maps = walk(root).filter((f) => f.endsWith('.js.map'));
          if (!maps.length) throw Error('No JavaScript source map');
          const groups = new Map();
          for (const file of maps) {
            const map = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!map.sourcesContent || map.sources.length !== map.sourcesContent.length) throw Error('No aligned source content');
            map.sources.forEach((name,i) => {
              const content=map.sourcesContent[i]; if (typeof content !== 'string') return;
              const pkg=name.match(/node_modules\/(?:\.bun\/[^/]+\/node_modules\/)?(@[^/]+\/[^/]+|[^/]+)/)?.[1] ?? '(app)';
              const group=groups.get(pkg) ?? {size:0,count:0,content:[]};
              group.size += Buffer.byteLength(content); group.count++; group.content.push(content); groups.set(pkg,group);
            });
          }
          const result=[...groups].map(([name,v]) => ({name,files:v.count,sourceBytes:v.size,gzipSourceBytes:zlib.gzipSync(v.content.join('\n')).length})).sort((a,b)=>b.sourceBytes-a.sourceBytes).slice(0,60);
          console.log('Source bytes prioritize investigation only; neither column measures actual bundle contribution or removal savings.');
          console.log(JSON.stringify(result,null,2));
          NODE
