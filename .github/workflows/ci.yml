name: Utils 1.5.1 paired budget diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ee32e652a8c06dd3b3524247190a8a85167896d2
          path: base
      - uses: actions/checkout@v7
        with:
          ref: 992741b4b8c00c0861d232e853bb1b72e209270d
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact heads and changed inputs
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = ee32e652a8c06dd3b3524247190a8a85167896d2
          test "$(git -C candidate rev-parse HEAD)" = 992741b4b8c00c0861d232e853bb1b72e209270d
          git -C candidate fetch --no-tags --depth=1 origin ee32e652a8c06dd3b3524247190a8a85167896d2
          git -C candidate diff --name-only ee32e652a8c06dd3b3524247190a8a85167896d2 HEAD | tee "$RUNNER_TEMP/changed-files"
          printf '%s\n' bun.lock packages/backend/package.json packages/frontend/__tests__/currency.test.ts packages/frontend/package.json packages/shared-types/package.json > "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
          git -C candidate diff --exit-code ee32e652a8c06dd3b3524247190a8a85167896d2 HEAD -- performance-budgets.json package.json
      - name: Install frozen dependencies in both trees
        run: |
          set -euo pipefail
          (cd base && bash .github/scripts/bun-install.sh --frozen-lockfile)
          (cd candidate && bash .github/scripts/bun-install.sh --frozen-lockfile)
      - name: Export both production web builds
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd base && bun run --cwd packages/frontend build)
          (cd candidate && bun run --cwd packages/frontend build)
      - name: Compare baseline and enforce candidate budget
        run: |
          set -euo pipefail
          echo Baseline
          (cd base && bun scripts/check-web-export-budget.mjs packages/frontend/dist)
          echo Candidate
          (cd candidate && bun scripts/check-web-export-budget.mjs packages/frontend/dist)
