name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver-and-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged frozen package inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Test scoping, symlinks, version and resolver delegation
        run: node --test scripts/diagnostics/alia-chart-opt-in.test.cjs
      - name: Install additive experimental exports into this runner only
        run: node scripts/diagnostics/install-chart-fixture.cjs
      - name: Typecheck experimental exports
        run: bun run --cwd packages/frontend typecheck
      - name: Compare actual chart component identities
        run: bun run --cwd packages/frontend test --runInBand aliaGranularChartDiagnostic.test.tsx
  context-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged frozen package inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Compare Alia ask and runtime contexts
        run: bun run --cwd packages/frontend test --runInBand aliaGranularContextDiagnostic.test.tsx
  web-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged frozen package inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export the exact baseline
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: |
          for file in packages/frontend/metro.config.js 'packages/frontend/app/(pages)/insights/index.tsx' packages/frontend/components/property/PriceRangeSection.tsx; do git show "0fab9c18ac2ddf20d1a7c7c6860523cb5411c194:$file" > "$file"; done
          bun run --cwd packages/frontend build --clear
          mv packages/frontend/dist /tmp/homiio-optin-baseline
          git checkout HEAD -- packages/frontend/metro.config.js 'packages/frontend/app/(pages)/insights/index.tsx' packages/frontend/components/property/PriceRangeSection.tsx
      - name: Install additive experimental exports into this runner only
        run: node scripts/diagnostics/install-chart-fixture.cjs
      - name: Export opt-in web
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --clear
      - name: Record production JS gzip metrics
        run: |
          echo 'Baseline metrics:'
          bun scripts/check-web-export-budget.mjs /tmp/homiio-optin-baseline || true
          echo 'Opt-in web metrics:'
          bun scripts/check-web-export-budget.mjs packages/frontend/dist || true
      - name: Export opt-in web with diagnostic maps
        working-directory: packages/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bunx expo export --platform web --output-dir /tmp/homiio-optin-web --source-maps --clear
      - name: Inspect web module identity
        run: node scripts/diagnostics/inspect-opt-in-maps.cjs /tmp/homiio-optin-web
  android-javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged frozen package inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Install additive experimental exports into this runner only
        run: node scripts/diagnostics/install-chart-fixture.cjs
      - name: Export opt-in android JavaScript with maps
        working-directory: packages/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bunx expo export --platform android --output-dir /tmp/homiio-optin-android --source-maps --clear
      - name: Inspect android module identity
        run: node scripts/diagnostics/inspect-opt-in-maps.cjs /tmp/homiio-optin-android
  ios-javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify unchanged frozen package inputs
        run: |
          git fetch --no-tags --depth=1 origin 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194
          git diff --exit-code 0fab9c18ac2ddf20d1a7c7c6860523cb5411c194 -- bun.lock package.json packages/frontend/package.json .github/scripts/bun-install.sh
      - name: Install frozen dependencies
        run: bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Install additive experimental exports into this runner only
        run: node scripts/diagnostics/install-chart-fixture.cjs
      - name: Export opt-in ios JavaScript with maps
        working-directory: packages/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bunx expo export --platform ios --output-dir /tmp/homiio-optin-ios --source-maps --clear
      - name: Inspect ios module identity
        run: node scripts/diagnostics/inspect-opt-in-maps.cjs /tmp/homiio-optin-ios
