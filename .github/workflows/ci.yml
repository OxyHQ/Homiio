name: Saved search bundle source inventory diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72399aaa47fd890b853e8ad76175c8f2af14452c
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify exact source and install frozen dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 72399aaa47fd890b853e8ad76175c8f2af14452c
          bash .github/scripts/bun-install.sh --frozen-lockfile
      - name: Export source map
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
        run: bun run --cwd packages/frontend build --source-maps
      - name: Inventory resolved modules (not bundle size)
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const root = 'packages/frontend/dist';
          const walk = (dir) => fs.readdirSync(dir, {withFileTypes:true}).flatMap((e) => e.isDirectory() ? walk(path.join(dir,e.name)) : [path.join(dir,e.name)]);
          const maps = walk(root).filter((f) => f.endsWith('.js.map'));
          if (!maps.length) throw Error('No JavaScript source map');
          const groups = new Map();
          const sample = [];
          for (const file of maps) {
            const map = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(map.sources)) throw Error('No source names');
            for (const name of map.sources) {
              if (sample.length < 8) sample.push(name);
              const pkg=name.match(/node_modules\/(?:\.bun\/[^/]+\/node_modules\/)?(@[^/]+\/[^/]+|[^/]+)/)?.[1] ?? '(app)';
              groups.set(pkg,(groups.get(pkg) ?? 0) + 1);
            }
          }
          console.log('Module counts only; they do not measure bundle contribution or removal savings.');
          console.log('Sample source names',JSON.stringify(sample));
          console.log(JSON.stringify([...groups].map(([name,count]) => ({name,count})).sort((a,b)=>b.count-a.count).slice(0,100),null,2));
          NODE
