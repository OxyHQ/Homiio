# Oxy Updates: Homiio's OTA update, on every push to main that can
# change its bundle. `oxy-ship` runs `expo export` and publishes the JS bundle
# and assets to channel `production` of Homiio's application, under the
# runtime of the app's `version` (withOxyUpdates, policy `appVersion`). A native
# change bumps `version`, and `android-release.yml` builds the binary for it.
#
# No secret: GitHub trusted publishing (OxyHQ/oxy ADR 0057). The job's OIDC
# token is exchanged for a five-minute `updates:publish` token of Homiio
# only, because this repository, `refs/heads/main` and THIS file's path are
# registered as its trusted publisher (oxy's seedOxyApplicationsSpecs.ts). Keep
# the path. Pull requests never publish.

name: Publish OTA update

# The export and publish are OxyHQ/oxy's shared .github/workflows/publish-ota-update.yml;
# `workflow_ref` in the OIDC token still names THIS file, so keep its path.

on:
  push:
    branches: [main]
    paths:
      - packages/frontend/**
      - packages/contracts/**
      - packages/shared-types/**
      - package.json
      - bun.lock
      - .github/workflows/publish-update.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: oxy-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: OxyHQ/oxy/.github/workflows/publish-ota-update.yml@main
    with:
      app_dir: packages/frontend
      # The application's PUBLIC client id (not a secret): the one in the manifest URL.
      client_id: oxy_dk_7d7b4924dcbfe16a245fb9c826b86d7bd43f0c5259c76ea1
      node_version: '22'
