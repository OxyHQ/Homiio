# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute homiio (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
name: Deploy to AWS

# GATED ON CI, but CALLED rather than triggered. `ci.yml` invokes this with
# `uses: ./.github/workflows/deploy-aws.yml` after every one of its jobs passes
# on a push to main.
#
# It used to trigger on `push: main`, which rolled an image out to production ECS
# without the test suite ever having run. The obvious replacement — `workflow_run`
# on CI, which is what deploy-frontends.yml uses — was tried and DOES NOT WORK for
# this workflow in this repository: it concluded `action_required` with zero jobs
# created, twice, before scheduling anything. The full evidence and what it rules
# out is in the `deploy-backend` comment in ci.yml. Do not "restore" the
# workflow_run trigger without re-testing it on main; it fails silently, in a run
# nobody looks at.
#
# `workflow_dispatch` is unchanged and remains the escape hatch: if CI itself
# breaks, a deploy can still be forced by hand from any ref, and the scope filter
# below does not apply to it.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize production rollouts. Cancelling after `update-service` would leave an
# unmonitored deployment running in ECS, so in-progress runs are never cancelled.
#
# **This group alone does NOT deliver that guarantee, and cannot.** This workflow
# is CALLED, and a called workflow runs inside the CALLER's run: cancel the
# caller and this job dies with it, whatever its own group says. So the guarantee
# is a property of TWO files, and the other one is `.github/workflows/ci.yml` —
# its `concurrency.cancel-in-progress` must stay false for `refs/heads/main`, the
# only ref that reaches this workflow automatically. It reads
# `${{ github.ref != 'refs/heads/main' }}` for exactly that reason; flipping it
# back to a bare `true` re-breaks this comment silently, in a different file,
# with nothing here to show for it.
#
# That is not a theoretical coupling: on 2026-08-09 runs `31300943279` and
# `31301131928` each had this job cancelled mid-deploy by the next merge to main,
# while this file said in-progress runs are never cancelled.
# `packages/backend/__tests__/unit/deployRolloutConcurrency.test.ts` fails the
# build if either half moves.
concurrency:
  group: deploy-homiio-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: homiio
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  # Which of the two lanes below owns the one-shot `pre` migrations. Both roll
  # the SAME compiled ledger through deploy-ecs-image.sh, and the migrator holds no
  # cross-process advisory lock, so it must run exactly once per release. Naming
  # the service here rather than setting RUN_MIGRATIONS per step is what makes
  # the workflow-level `RUN_MIGRATIONS` below safe: the worker lane sets APP to
  # `homiio-worker`, which does not match, and it declines with a notice.
  MIGRATION_SERVICE: homiio
  # THE DEPLOY APPLIES MIGRATIONS. It did not until this line existed, and the
  # gap was invisible: `RUN_MIGRATIONS` defaults to `false` in
  # deploy-ecs-image.sh, nothing set it, and every deploy was green.
  #
  # What that cost, on 2026-08-10: production was four migrations behind (0008,
  # 0009, 0010, 0011) and `/api/cities` and `/api/home/sections` both answered
  # 500 until the one-shot was run BY HAND. The migrations had merged with green
  # CI, green deploys, and a passing `check-migration-phases.mjs` gate — which
  # verifies every migration DECLARES a phase, while nothing consumed the
  # declaration. A green gate about a pipeline that does nothing.
  #
  # Two preconditions the old comment here named, and where each stands:
  #
  #   - `/oxy/homiio/DATABASE_URL` must exist in SSM, or the one-shot fails and
  #     takes the release with it. It exists; it is the only database secret
  #     either task definition carries, and the sync step below maintains it.
  #   - Two migrators must not run concurrently. `db/migrate.ts` records this as
  #     a PRECONDITION of turning this on, because drizzle reads the ledger's
  #     high-water mark outside its transaction. The interlock is the
  #     `concurrency` block above plus `ci.yml`'s non-cancelling group on main,
  #     pinned by `deployRolloutConcurrency.test.ts` — see `db/migrate.ts` for
  #     what is left uncovered and what it would cost.
  #
  # Quoted so the value reaching the script is the string `true`. The script
  # rejects anything that is neither `true` nor `false` rather than treating an
  # unparseable value as off.
  RUN_MIGRATIONS: 'true'
  # The commit CI judged. When called from ci.yml this IS that commit, because a
  # called workflow runs inside the caller's run — there is no window in which
  # main moves on underneath. Under workflow_dispatch it is the dispatched ref.
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  scope:
    # No conclusion/branch/fork guard here any more, and none is needed: the only
    # automatic caller is ci.yml's `deploy-backend`, which already requires every
    # CI job to have passed on a push to refs/heads/main. Re-checking it here
    # would be a second copy of a condition that can drift from the real one.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff reads <sha>^1..<sha>, so the parent has to be present.
          fetch-depth: 2
      - name: Detect backend deployment scope
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            echo "manual dispatch: deploying regardless of what changed"
          else
            bash .github/scripts/deployment-scope.sh backend
          fi

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`. That expression is what made this workflow conclude
      # `action_required` with zero jobs on `workflow_run` — the failure the
      # comment above, and the `deploy-backend` comment in ci.yml, record as
      # unexplained. A workflow that walks every repository secret into a shell
      # loop is shaped exactly like an exfiltration payload, so GitHub's abuse
      # detection holds the run until a human clicks "Approve and run" in the
      # UI. The REST approve endpoint only serves fork pull requests, so it
      # cannot be automated, and the approval is per run.
      #
      # The two observations that were taken to rule this out do not: the
      # "identical" CrowdSource deploy-aws.yml that schedules fine is not
      # identical — it syncs from an explicit `SSM_SECRET_ALLOWLIST` and never
      # builds the blob — and deploy-frontends.yml, which runs on `workflow_run`
      # in this repository without trouble, has no such step at all.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace, and this repo could overwrite the /oxy/_shared/* parameters
      # that other services read.
      #
      # The list covers BOTH task definitions rolled below — the `homiio` API and
      # the `homiio-worker` listing worker — including additions in the matching
      # oxy-infra release. **A secret added to either task definition has to be
      # added here in the SAME release, or it silently never syncs**: this step
      # reports success either way, because it only ever reports on the names it
      # was given.
      #
      # That is not hypothetical. `DATABASE_URL` was added to the repository
      # secrets and to both task definitions during the Postgres cutover on
      # 2026-08-09 and NOT added here. `/oxy/homiio/DATABASE_URL` was written by
      # hand, every deploy that followed synced the other six and reported
      # success, and a rotation of that secret would have propagated to nothing.
      # It cost seven hours of the parameter being unmanaged; it would have cost
      # an outage the first time somebody rotated it and believed the green run.
      #
      # Re-derive the list from what the containers actually read, never from
      # memory or from this comment:
      #
      #   AWS_PROFILE=oxy AWS_REGION=us-west-2 aws ecs describe-task-definition \
      #     --task-definition oxy-homiio \
      #     --query 'taskDefinition.containerDefinitions[0].secrets[].name'
      #   # …and again for oxy-homiio-worker.
      #
      # `packages/backend/__tests__/unit/deploySecretSync.test.ts` pins the two
      # spellings below against each other and against that derivation, so a
      # half-edit fails the build rather than a deploy months later.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          # Read by BOTH families, and the only datastore there is. `MONGODB_URI`
          # was here beside it and is GONE: nothing reads it, it is off both task
          # definitions, and the SSM parameter is deleted. Removing the parameter
          # alone would not have held — this sync recreated it on the next deploy,
          # which is the general shape worth remembering: removing a value does
          # not remove the thing that produces it.
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # API only.
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          # Homiio's product-to-Oxy service identity. Provider credentials are
          # owned by Kaana and must never enter this repository or task.
          APP_OXY_SERVICE_API_KEY: ${{ secrets.OXY_SERVICE_API_KEY }}
          APP_OXY_SERVICE_API_SECRET: ${{ secrets.OXY_SERVICE_API_SECRET }}
          # Worker only.
          APP_LISTING_RESIDENTIAL_PROXY_URL: ${{ secrets.LISTING_RESIDENTIAL_PROXY_URL }}
          SHARED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SHARED_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SHARED_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret JWT_SECRET "$APP_JWT_SECRET" "/oxy/$APP/JWT_SECRET"
          sync_secret JWT_REFRESH_SECRET "$APP_JWT_REFRESH_SECRET" "/oxy/$APP/JWT_REFRESH_SECRET"
          sync_secret OXY_SERVICE_API_KEY "$APP_OXY_SERVICE_API_KEY" "/oxy/$APP/OXY_SERVICE_API_KEY"
          sync_secret OXY_SERVICE_API_SECRET "$APP_OXY_SERVICE_API_SECRET" "/oxy/$APP/OXY_SERVICE_API_SECRET"
          sync_secret LISTING_RESIDENTIAL_PROXY_URL "$APP_LISTING_RESIDENTIAL_PROXY_URL" "/oxy/$APP/LISTING_RESIDENTIAL_PROXY_URL"
          sync_secret AWS_ACCESS_KEY_ID "$SHARED_AWS_ACCESS_KEY_ID" "/oxy/_shared/AWS_ACCESS_KEY_ID"
          sync_secret AWS_SECRET_ACCESS_KEY "$SHARED_AWS_SECRET_ACCESS_KEY" "/oxy/_shared/AWS_SECRET_ACCESS_KEY"

          # Valkey lives in the cluster's region; a URL from another region
          # leaves the worker silently without a cache, so it is rejected.
          if [ -n "$SHARED_REDIS_URL" ] && [ "$SHARED_REDIS_URL" != "-" ] &&
             [ "$AWS_REGION" = "us-west-2" ] &&
             ! printf '%s' "$SHARED_REDIS_URL" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
            echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
          else
            sync_secret REDIS_URL "$SHARED_REDIS_URL" "/oxy/_shared/REDIS_URL"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API + listing worker (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # The digest comes out of the build itself, via --metadata-file.
          # Resolving it afterwards with `aws ecr describe-images` is not an
          # option here: oxy-github-deploy has no ecr:DescribeImages, confirmed
          # with `aws iam simulate-principal-policy` (implicitDeny), so that
          # call fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            --target api \
            -t "$IMG:$COMMIT_TAG-api" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-api-metadata.json" \
            --push \
            .

          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            --target worker \
            -t "$IMG:$COMMIT_TAG-worker" \
            -t "$IMG:latest-worker" \
            --metadata-file "$RUNNER_TEMP/build-worker-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          API_DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-api-metadata.json")
          WORKER_DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-worker-metadata.json")
          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable API image digest (got: ${API_DIGEST:-<empty>})"
            exit 1
          fi
          if [[ ! "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable worker image digest (got: ${WORKER_DIGEST:-<empty>})"
            exit 1
          fi
          echo "api_digest=$API_DIGEST" >>"$GITHUB_OUTPUT"
          echo "worker_digest=$WORKER_DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG API -> $API_DIGEST"
          echo "Built $COMMIT_TAG worker -> $WORKER_DIGEST"

      # Two ECS services, two purpose-built targets from the same compiled
      # commit. They are separate task-definition families
      # with different container names (`homiio` / `homiio-worker`), so each gets
      # its own register-and-roll pass; only the ECR repository is shared, which
      # is why IMAGE_URI is built from the workflow's APP and the per-service
      # name is overridden instead. Only the worker carries Chromium/X11.
      #
      # Rolling them in sequence rather than in parallel is a change in kind from
      # the previous step, which fired both `update-service` calls and then
      # waited on both: the worker now only starts once the API has reached a
      # healthy steady state, and a failed API rollout stops the worker from
      # moving at all. Both targets carry the same backend build, so a commit
      # the API cannot serve is not one to hand the worker.
      - name: Register immutable task definition and deploy (API)
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.api_digest }}
          # Cleared deliberately. The script treats a non-empty DEPLOY_SHA as a
          # request to re-verify that the candidate is still the exact head of
          # origin/main before mutating production, via require-current-main.sh,
          # which this repository does not ship. Adopting that guard would make a
          # deploy FAIL rather than ship a slightly-stale commit whenever main
          # moves during CI -- a policy change, and a separate one from pinning
          # the image. DEPLOY_SHA keeps its meaning for checkout and the scope
          # filter above.
          DEPLOY_SHA: ''
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      # THE `post` MIGRATION PHASE RUNS HERE, AND THE LANE IS THE ASSERTION.
      #
      # `pre` is additive and correct against both images, so it runs before the
      # API rollout. `post` takes something away — a DROP, a RENAME, a narrowed
      # CHECK — so it is only safe once NO old image is serving. Both services
      # run the SAME compiled commit, and the worker rolls last, so "no old code
      # is serving" is first true at the end of THIS step and not the API one.
      # Putting it on the API lane would drop a column out from under a worker
      # still running the previous image for the length of its own rollout.
      #
      # `POST_DEPLOY_TASK_COMMAND_JSON` is the hook deploy-ecs-image.sh already
      # provides for exactly this position: after `update-service`, after the
      # rollout reaches a healthy steady state, and after any smoke checks. A
      # non-zero exit fails the job and rolls this service back.
      #
      # IT IS UNCONDITIONAL, WHICH IS THE POINT. Sibling repos grep the release
      # for a post-phase marker and skip this task when it finds none, to save a
      # Fargate task. Homiio does not, for two reasons. A wrong grep reads as "no
      # post migration in this release" and silently skips the drop — the same
      # silent-skip shape as the defect this whole change repairs — whereas a
      # wrong COMMAND fails loudly on the first release that needs it. And an
      # ungated task runs the post path on every deploy, so it cannot rot between
      # the day it is written and the day it first matters. With nothing pending
      # the migrator logs `No migrations to apply (phase=post, journal
      # entries=N)` and exits 0.
      #
      # It cannot block a normal release either: `--phase=post` refuses only when
      # a `pre` migration is still pending after the rollout, and the `pre` run
      # in the API lane above would already have failed the job before this step
      # was reached (see @oxyhq/db's `phases.ts`, `planMigrationRun`).
      - name: Register immutable task definition and deploy (listing worker)
        env:
          # Still oxy/homiio: APP names the ECS SERVICE, while this is the
          # browser-enabled worker target. Derived in the shell below rather than in this map,
          # so there is no question of whether `env.APP` here means the
          # workflow's value or one a sibling key just set.
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.worker_digest }}
          DEPLOY_SHA: ''
          POST_DEPLOY_TASK_COMMAND_JSON: '["node","packages/backend/dist/db/migrate.js","--target-database=homiio","--phase=post"]'
        run: |
          export APP="${APP}-worker"
          # CONTAINER_NAME is left to default to APP, which is what the
          # oxy-homiio-worker family actually calls its container.
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            # Not silent, because this branch now skips the post migration too.
            # It self-corrects loudly rather than quietly: the next release's
            # `pre` run BLOCKS on a `pre` migration queued behind the unapplied
            # `post` one and names both files.
            echo "::warning::ECS service $APP does not exist, so the post-deploy migration phase did not run either. Any post-rollout migration in this release is unapplied."
            echo "image is in ECR, skipping $APP"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh
