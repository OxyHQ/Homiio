# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute homiio (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
name: Deploy to AWS

# GATED ON CI, but CALLED rather than triggered. `ci.yml` invokes this with
# `uses: ./.github/workflows/deploy-aws.yml` after every one of its jobs passes
# on a push to main.
#
# It used to trigger on `push: main`, which rolled an image out to production ECS
# without the test suite ever having run. The obvious replacement — `workflow_run`
# on CI, which is what deploy-frontends.yml uses — was tried and DOES NOT WORK for
# this workflow in this repository: it concluded `action_required` with zero jobs
# created, twice, before scheduling anything. The full evidence and what it rules
# out is in the `deploy-backend` comment in ci.yml. Do not "restore" the
# workflow_run trigger without re-testing it on main; it fails silently, in a run
# nobody looks at.
#
# `workflow_dispatch` is unchanged and remains the escape hatch: if CI itself
# breaks, a deploy can still be forced by hand from any ref, and the scope filter
# below does not apply to it.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize production rollouts. Cancelling after `update-service` would leave an
# unmonitored deployment running in ECS, so in-progress runs are never cancelled.
concurrency:
  group: deploy-homiio-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: homiio
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  # The commit CI judged. When called from ci.yml this IS that commit, because a
  # called workflow runs inside the caller's run — there is no window in which
  # main moves on underneath. Under workflow_dispatch it is the dispatched ref.
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  scope:
    # No conclusion/branch/fork guard here any more, and none is needed: the only
    # automatic caller is ci.yml's `deploy-backend`, which already requires every
    # CI job to have passed on a push to refs/heads/main. Re-checking it here
    # would be a second copy of a condition that can drift from the real one.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff reads <sha>^1..<sha>, so the parent has to be present.
          fetch-depth: 2
      - name: Detect backend deployment scope
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            echo "manual dispatch: deploying regardless of what changed"
          else
            bash .github/scripts/deployment-scope.sh backend
          fi

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`. That expression is what made this workflow conclude
      # `action_required` with zero jobs on `workflow_run` — the failure the
      # comment above, and the `deploy-backend` comment in ci.yml, record as
      # unexplained. A workflow that walks every repository secret into a shell
      # loop is shaped exactly like an exfiltration payload, so GitHub's abuse
      # detection holds the run until a human clicks "Approve and run" in the
      # UI. The REST approve endpoint only serves fork pull requests, so it
      # cannot be automated, and the approval is per run.
      #
      # The two observations that were taken to rule this out do not: the
      # "identical" CrowdSource deploy-aws.yml that schedules fine is not
      # identical — it syncs from an explicit `SSM_SECRET_ALLOWLIST` and never
      # builds the blob — and deploy-frontends.yml, which runs on `workflow_run`
      # in this repository without trouble, has no such step at all.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace, and this repo could overwrite the /oxy/_shared/* parameters
      # that other services read.
      #
      # The list covers BOTH task definitions rolled below — the `homiio` API and
      # the `homiio-worker` listing worker. Adding a new secret means adding it
      # here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          # Worker only.
          APP_LISTING_RESIDENTIAL_PROXY_URL: ${{ secrets.LISTING_RESIDENTIAL_PROXY_URL }}
          SHARED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SHARED_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SHARED_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret MONGODB_URI "$APP_MONGODB_URI" "/oxy/$APP/MONGODB_URI"
          sync_secret JWT_SECRET "$APP_JWT_SECRET" "/oxy/$APP/JWT_SECRET"
          sync_secret JWT_REFRESH_SECRET "$APP_JWT_REFRESH_SECRET" "/oxy/$APP/JWT_REFRESH_SECRET"
          sync_secret LISTING_RESIDENTIAL_PROXY_URL "$APP_LISTING_RESIDENTIAL_PROXY_URL" "/oxy/$APP/LISTING_RESIDENTIAL_PROXY_URL"
          sync_secret AWS_ACCESS_KEY_ID "$SHARED_AWS_ACCESS_KEY_ID" "/oxy/_shared/AWS_ACCESS_KEY_ID"
          sync_secret AWS_SECRET_ACCESS_KEY "$SHARED_AWS_SECRET_ACCESS_KEY" "/oxy/_shared/AWS_SECRET_ACCESS_KEY"

          # Valkey lives in the cluster's region; a URL from another region
          # leaves the worker silently without a cache, so it is rejected.
          if [ -n "$SHARED_REDIS_URL" ] && [ "$SHARED_REDIS_URL" != "-" ] &&
             [ "$AWS_REGION" = "us-west-2" ] &&
             ! printf '%s' "$SHARED_REDIS_URL" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
            echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
          else
            sync_secret REDIS_URL "$SHARED_REDIS_URL" "/oxy/_shared/REDIS_URL"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # The digest comes out of the build itself, via --metadata-file.
          # Resolving it afterwards with `aws ecr describe-images` is not an
          # option here: oxy-github-deploy has no ecr:DescribeImages, confirmed
          # with `aws iam simulate-principal-policy` (implicitDeny), so that
          # call fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      # Two ECS services, one image. They are separate task-definition families
      # with different container names (`homiio` / `homiio-worker`), so each gets
      # its own register-and-roll pass; only the ECR repository is shared, which
      # is why IMAGE_URI is built from the workflow's APP and the per-service
      # name is overridden instead.
      #
      # Rolling them in sequence rather than in parallel is a change in kind from
      # the previous step, which fired both `update-service` calls and then
      # waited on both: the worker now only starts once the API has reached a
      # healthy steady state, and a failed API rollout stops the worker from
      # moving at all. That ordering is the point -- the two run the same image,
      # so an image the API cannot stay up on is not one to hand the worker.
      - name: Register immutable task definition and deploy (API)
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          # Cleared deliberately. The script treats a non-empty DEPLOY_SHA as a
          # request to re-verify that the candidate is still the exact head of
          # origin/main before mutating production, via require-current-main.sh,
          # which this repository does not ship. Adopting that guard would make a
          # deploy FAIL rather than ship a slightly-stale commit whenever main
          # moves during CI -- a policy change, and a separate one from pinning
          # the image. DEPLOY_SHA keeps its meaning for checkout and the scope
          # filter above.
          DEPLOY_SHA: ''
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      - name: Register immutable task definition and deploy (listing worker)
        env:
          # Still oxy/homiio: APP names the ECS SERVICE, and the worker shares
          # the API's image. Derived in the shell below rather than in this map,
          # so there is no question of whether `env.APP` here means the
          # workflow's value or one a sibling key just set.
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DEPLOY_SHA: ''
        run: |
          export APP="${APP}-worker"
          # CONTAINER_NAME is left to default to APP, which is what the
          # oxy-homiio-worker family actually calls its container.
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping $APP"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh
