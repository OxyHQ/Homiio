name: Refresh build cache

# Weekly, rebuild the production images with NO cache and write the fresh layers
# into the GitHub Actions cache scopes deploy-aws.yml reads, so the deploy's cached
# layers stop pinning an old `apt-get`/`apk` result and pick up OS security
# patches. Builds only: no AWS credentials, no push, no deploy. It runs on main
# (schedule or a dispatch from main) and writes main's cache.
# OxyHQ/oxy .github/workflows/refresh-app-image-cache.yml.

on:
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-build-cache
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: read
    uses: OxyHQ/oxy/.github/workflows/refresh-app-image-cache.yml@main
    with:
      buildkit_image: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      targets: >-
        [
          {"name": "homiio-api", "scope": "homiio-api", "recipe": "homiio"},
          {"name": "homiio-worker", "scope": "homiio-worker", "recipe": "homiio-worker"}
        ]
  refresh-amd64:
    permissions:
      contents: read
    uses: OxyHQ/oxy/.github/workflows/refresh-app-image-cache.yml@main
    with:
      runs_on: ubuntu-24.04
      platform: linux/amd64
      buildkit_image: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      targets: >-
        [
          {"name": "homiio-api-amd64", "scope": "homiio-api-amd64", "recipe": "homiio"},
          {"name": "homiio-worker-amd64", "scope": "homiio-worker-amd64", "recipe": "homiio-worker"}
        ]
