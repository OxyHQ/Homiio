version: 2
updates:
  # The labels are QUOTED on purpose. Unquoted, `- type: deps` is a YAML
  # mapping ({type: deps}), not the string "type: deps", and Dependabot rejects
  # the whole file: from 2026-05-21, when this config was written, until the fix
  # no `bun` or `github_actions` version-update job ever ran in this repository.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      oxy-platform:
        patterns:
          - "@oxy.so/*"
      minor-and-patch:
        update-types: [minor, patch]
    labels:
      - "type: deps"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "type: infra"
