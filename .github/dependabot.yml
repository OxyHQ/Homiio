version: 2
updates:
  # The labels are QUOTED on purpose. Unquoted, `- type: deps` is a YAML
  # mapping ({type: deps}), not the string "type: deps", and Dependabot rejects
  # the whole file: from 2026-05-21, when this config was written, until the fix
  # no `bun` or `github_actions` version-update job ever ran in this repository.
  #
  # WEEKLY, and at most two PRs per run (oxy-platform + minor-and-patch). Daily
  # updates with one PR per major produced ~139 CI runs a week from Dependabot
  # alone, each 9 jobs, against the org's 20 concurrent job slots (free plan),
  # so every other repository queued behind them. Security updates are separate
  # from this schedule and still open as soon as an advisory lands.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Listed BEFORE minor-and-patch: a dependency joins the first group it
      # matches. This group auto-merges (automerge-first-party.yml).
      oxy-platform:
        patterns:
          - "@oxy.so/*"
          - "@alia.onl/*"
          - "@clarity.surf/*"
      # Everything else, MAJORS INCLUDED, in one PR: the Expo SDK majors move
      # together anyway. A major that breaks the build reds this PR; drop it
      # with `@dependabot ignore <dependency> major` rather than splitting the
      # group back into one PR per package.
      minor-and-patch:
        patterns:
          - "*"
        update-types: [major, minor, patch]
    labels:
      - "type: deps"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR per run instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type: infra"
